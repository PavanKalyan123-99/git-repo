const student = {
  name : "pavan kalyan",
  course : "full stack",
};
const studentJSON = JSON.stringify(student);
localstorage.setItem("student", studentJSON);


const storedData = localstorage.getItem("student");
const parsedstudent = JSON.parse(storedData);

console.log(parsedstudent.course);
