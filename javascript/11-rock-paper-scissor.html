<!DOCTYPE html>
<html>
<head>
<title>Rock Paper Scissors</title>

<style>
body{
  background-color:#0f1419;
  color:white;
  font-family:Arial;
}

.move-button{
  width:120px;
  height:120px;
  border-radius:50%;
  border:4px solid white;
  background:transparent;
  margin:15px;
  cursor:pointer;
}

.move-button img{
  width:60px;
}

.js-moves img{
  width:40px;
  margin:5px;
}
</style>

</head>

<body>
<h2>Rock Paper Scissors</h2>

<button class="move-button" onclick="playGame('rock')">
<img src="rock-emoji.png">
</button>

<button class="move-button" onclick="playGame('paper')">
<img src="paper-emoji.png">
</button>

<button class="move-button" onclick="playGame('scissors')">
<img src="scissors-emoji.png">
</button>

<p class="js-result"></p>
<p class="js-moves"></p>
<p class="js-score"></p>

<button onclick="resetScore()">Reset Score</button>

<script>

let score = JSON.parse(localStorage.getItem('score')) || {
  win:0,
  lose:0,
  tie:0
};

updateScore();

function pickComputerMove(){

  const randomNumber = Math.random();

  if(randomNumber < 1/3){
    return 'rock';
  } 
  else if(randomNumber < 2/3){
    return 'paper';
  } 
  else{
    return 'scissors';
  }

}

function getMoveImage(move){

  if(move === 'rock'){
    return '<img src="rock-emoji.png" width="40">';
  }

  if(move === 'paper'){
    return '<img src="paper-emoji.png" width="40">';
  }

  if(move === 'scissors'){
    return '<img src="scissors-emoji.png" width="40">';
  }

}

function playGame(playerMove){

  const computerMove = pickComputerMove();

  let result = '';

  if(playerMove === 'rock'){
    if(computerMove === 'rock') result = 'Tie';
    else if(computerMove === 'paper') result = 'You Lose';
    else result = 'You Win';
  }

  if(playerMove === 'paper'){
    if(computerMove === 'rock') result = 'You Win';
    else if(computerMove === 'paper') result = 'Tie';
    else result = 'You Lose';
  }

  if(playerMove === 'scissors'){
    if(computerMove === 'rock') result = 'You Lose';
    else if(computerMove === 'paper') result = 'You Win';
    else result = 'Tie';
  }

  if(result === 'You Win'){
    score.win++;
  }
  else if(result === 'You Lose'){
    score.lose++;
  }
  else{
    score.tie++;
  }

  localStorage.setItem('score', JSON.stringify(score));

  document.querySelector('.js-result').innerHTML = result;

  document.querySelector('.js-moves').innerHTML =
  `You ${getMoveImage(playerMove)} ${getMoveImage(computerMove)} Computer`;

  updateScore();

}

function updateScore(){

  document.querySelector('.js-score').innerHTML =
  `Wins: ${score.win}, Losses: ${score.lose}, Ties: ${score.tie}`;

}

function resetScore(){

  score = {
    win:0,
    lose:0,
    tie:0
  };

  localStorage.setItem('score', JSON.stringify(score));

  updateScore();

}

</script>

</body>
</html>
