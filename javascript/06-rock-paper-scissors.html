<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
</head>

<body>

<p>Rock Paper Scissors</p>

<button onclick="playGame('rock')">rock</button>
<button onclick="playGame('paper')">paper</button>
<button onclick="playGame('scissor')">scissor</button>

<script>

let computerGuess = '';

function pickComputerMove(){
  const randomnumber = Math.random();

  if(randomnumber < 1/3){
    computerGuess = 'rock';
  }
  else if(randomnumber < 2/3){
    computerGuess = 'paper';
  }
  else{
    computerGuess = 'scissors';
  }
}

function playGame(playerMove){
  pickComputerMove();

  let result = '';

  if(playerMove === 'rock'){
    if(computerGuess === 'rock') result = 'tie';
    else if(computerGuess === 'paper') result = 'you lose';
    else result = 'you win';
  }

  if(playerMove === 'paper'){
    if(computerGuess === 'rock') result = 'you win';
    else if(computerGuess === 'paper') result = 'tie';
    else result = 'you lose';
  }

  if(playerMove === 'scissors'){
    if(computerGuess === 'rock') result = 'you lose';
    else if(computerGuess === 'paper') result = 'you win';
    else result = 'tie';
  }
  alert(`You picked ${playerMove}. Computer picked ${computerGuess}. ${result}`);
}

</script>

</body>
</html>
