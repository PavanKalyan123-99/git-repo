<!DOCTYPE html>
<html>
<head>
  <title>Rock Paper Scissors</title>
</head>
<body>
<p>Rock Paper Scissors</p>
<button onclick="playGame('rock')">rock</button>
<button onclick="playGame('paper')">paper</button>
<button onclick="playGame('scissors')">scissors</button>
<p class="js-result"></p>
<p class="js-moves"></p>
<p class = "js-score"></p>
<button onclick="resetscore()">reset score</button>
<script>
  let score = JSON.parse(localStorage.getItem('score')) || {
    win : 0,
    lose : 0,
    tie : 0
  };
  updatescore();
let computerGuess = '';
function pickComputerMove(){
  const randomnumber = Math.random();
  if(randomnumber < 1/3){
    computerGuess = 'rock';
  }
  else if(randomnumber < 2/3){
    computerGuess = 'paper';
  }
  else{
    computerGuess = 'scissors';
  }
}
function playGame(playerMove){
  pickComputerMove();
  let result = '';
  if(playerMove === 'rock'){
    if(computerGuess === 'rock') result = 'tie';
    else if(computerGuess === 'paper') result = 'you lose';
    else result = 'you win';
  }
  if(playerMove === 'paper'){
    if(computerGuess === 'rock') result = 'you win';
    else if(computerGuess === 'paper') result = 'tie';
    else result = 'you lose';
  }
  if(playerMove === 'scissors'){
    if(computerGuess === 'rock') result = 'you lose';
    else if(computerGuess === 'paper') result = 'you win';
    else result = 'tie';
  }
  if(result === 'you win'){
    score.win+=1;
  }
  else if (result === 'you lose'){
    score.lose+=1;
  }
  else {
    score.tie +=1;
  }
  localStorage.setItem('score', JSON.stringify(score));
  document.querySelector('.js-result').innerHTML = result;
  document.querySelector('.js-moves').innerHTML = 
  `You ${playerMove} - Computer ${computerGuess}`;
  updatescore();
}
function updatescore(){
  document.querySelector('.js-score').innerHTML = 
  `wins : ${score.win}, losses : ${score.lose}, ties : ${score.tie}`;
}
function resetscore(){
  score = {
    win: 0,
    lose: 0,
    tie: 0
  };
  localStorage.setItem('score', JSON.stringify(score));
  alert('score was reset.');
}
</script>
</body>
</html>
